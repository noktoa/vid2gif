name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # Go modules and build cache, keyed on go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "cmd/vid2gif-app/frontend/*.test.js"

  # The app is Windows-only; this builds it the way release.ps1 does and runs
  # the Windows-only tests (internal/proc, filesrv symlinks).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -tags desktop,production -ldflags "-H windowsgui -s -w -X main.version=ci" -o dist/vid2gif-app.exe ./cmd/vid2gif-app
      - run: go vet ./...
      - run: go test ./...
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add --global WixToolset.UI.wixext/6.0.2 WixToolset.Util.wixext/6.0.2
      # Builds the MSI as 0.0.1 and 0.0.2, installs per-user, upgrades and
      # uninstalls; the install step downloads the pinned tools (about 250 MB).
      - name: MSI test
        run: ./installer/test.ps1
