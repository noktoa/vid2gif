<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="vid2gif">
  <title>vid2gif</title>
  <!-- Tile: the Make-button yellow with the app's 2px-style ink outline, scaled to 256. -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="#FFD60A" stroke="#1E1B24" stroke-width="12"/>
  <!-- The rental slip: card stock with a perforated stub on the left. -->
